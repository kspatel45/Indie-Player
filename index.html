<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indie Player</title>
    <meta name="theme-color" content="#0a0e12">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4159833368007973" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --primary: #4169e1; --bg-dark: #0a0e12; --panel: #161b22; }
        body { background-color: var(--bg-dark); color: #f0f6fc; font-family: sans-serif; overflow: hidden; height: 100vh; width: 100vw; position: fixed; }
        .glass-player { background: rgba(22, 27, 34, 0.98); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); }
        .active-track { border-left: 4px solid var(--primary); background: rgba(65, 105, 225, 0.1); }
        .progress-bar { appearance: none; height: 4px; background: #30363d; border-radius: 2px; width: 100%; }
        .progress-bar::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; }
        .tab-active { color: white; border-bottom: 2px solid var(--primary); }
    </style>
</head>
<body class="flex flex-col">

    <header class="p-4 border-b border-slate-800 bg-[#0d1117]">
        <div class="max-w-6xl mx-auto flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-black tracking-tighter">Indie<span class="text-[#4169e1]">Player</span></h1>
                <div id="sleepTimer" class="text-[10px] text-slate-500 font-mono"></div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="Search music..." class="flex-grow bg-[#161b22] border border-slate-700 rounded-full px-4 py-2 text-sm focus:outline-none">
                <button onclick="triggerSearch()" class="bg-[#4169e1] px-5 py-2 rounded-full text-xs font-bold">Search</button>
            </div>
            <div class="flex gap-4 text-xs font-bold text-slate-500">
                <button onclick="switchTab('all')" id="tab-all" class="pb-1 tab-active">Discovery</button>
                <button onclick="switchTab('fav')" id="tab-fav" class="pb-1">Favorites</button>
            </div>
        </div>
    </header>

    <main class="flex-grow overflow-y-auto p-4 pb-44 custom-scrollbar">
        <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    </main>

    <div class="bg-black/20 py-1 flex justify-center">
        <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" 
             data-ad-client="ca-pub-4159833368007973" data-ad-slot="8734484373"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 glass-player z-50">
        <div class="px-2"><input type="range" id="progressBar" value="0" class="progress-bar" oninput="isSeeking=true" onchange="seekAudio()"></div>
        <div class="flex items-center justify-between p-4 max-w-6xl mx-auto">
            <div class="flex items-center gap-3 w-1/3 overflow-hidden">
                <img id="playerCover" class="w-10 h-10 rounded bg-slate-800 object-cover">
                <div class="truncate">
                    <p id="playerTitle" class="text-xs font-bold truncate">Not Playing</p>
                    <p id="playerArtist" class="text-[10px] text-slate-500 truncate">Select song</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="changeTrack(-1)"><i class="fas fa-step-backward"></i></button>
                <button id="masterPlayBtn" onclick="togglePlay()" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center"><i class="fas fa-play ml-1"></i></button>
                <button onclick="changeTrack(1)"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="w-1/3 text-right">
                <button id="favBtn" onclick="toggleFavorite(event)" class="text-slate-500"><i class="far fa-heart"></i></button>
            </div>
        </div>
    </footer>

    <audio id="mainAudio" crossorigin="anonymous" playsinline></audio>

    <script>
        const audio = document.getElementById('mainAudio');
        let playlist = [], favorites = JSON.parse(localStorage.getItem('favs') || '[]'), currentIndex = -1, isSeeking = false, currentView = 'all';
        let wakeLock = null;

        // Keep Screen/CPU Awake
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
        document.addEventListener('click', requestWakeLock, { once: true });

        window.onload = () => {
            fetchSongs('search/songs?query=trending&limit=20');
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => audio.play());
                navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => changeTrack(-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => changeTrack(1));
            }
        };

        async function fetchSongs(endpoint) {
            const res = await fetch(`https://saavn.dev/api/${endpoint}`);
            const result = await res.json();
            playlist = result.data?.results || result.data || [];
            renderView();
        }

        function renderView() {
            const list = currentView === 'all' ? playlist : favorites;
            document.getElementById('resultsGrid').innerHTML = list.map((s, i) => `
                <div onclick="playSong(${i})" class="p-3 rounded-xl bg-slate-800/30 ${currentIndex === i ? 'active-track' : ''}">
                    <img src="${s.image[s.image.length-1].url}" class="w-full aspect-square object-cover rounded-lg mb-2">
                    <p class="text-xs font-bold truncate">${s.name}</p>
                </div>
            `).join('');
        }

        function playSong(index) {
            const list = currentView === 'all' ? playlist : favorites;
            if (index < 0 || index >= list.length) return;
            currentIndex = index;
            const song = list[index];
            audio.src = song.downloadUrl[song.downloadUrl.length-1].url;
            document.getElementById('playerTitle').textContent = song.name;
            document.getElementById('playerCover').src = song.image[0].url;
            audio.play();
            updateMediaSession(song);
            renderView();
        }

        function updateMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.name,
                    artist: song.artists.primary[0].name,
                    artwork: [{ src: song.image[song.image.length-1].url, sizes: '512x512', type: 'image/jpeg' }]
                });
            }
        }

        audio.onended = () => changeTrack(1);
        audio.onplay = () => { document.getElementById('masterPlayBtn').innerHTML = '<i class="fas fa-pause"></i>'; };
        audio.onpause = () => { document.getElementById('masterPlayBtn').innerHTML = '<i class="fas fa-play ml-1"></i>'; };
        audio.ontimeupdate = () => {
            if (!isSeeking) document.getElementById('progressBar').value = (audio.currentTime / audio.duration) * 100 || 0;
        };

        function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
        function changeTrack(dir) { playSong(currentIndex + dir); }
        function seekAudio() { isSeeking = false; audio.currentTime = (document.getElementById('progressBar').value / 100) * audio.duration; }
        function triggerSearch() { fetchSongs(`search/songs?query=${encodeURIComponent(document.getElementById('searchInput').value)}&limit=30`); }
        function switchTab(v) { currentView = v; renderView(); }
    </script>
</body>
</html>
