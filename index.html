<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indie Player Pro</title>
    <meta name="theme-color" content="#0a0e12">
    <link rel="manifest" href="./manifest.json">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4159833368007973" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --primary: #4169e1; --bg-dark: #0a0e12; --panel: #161b22; }
        body { background-color: var(--bg-dark); color: #f0f6fc; font-family: sans-serif; overflow: hidden; height: 100vh; position: fixed; width: 100%; }
        .active-track { border-left: 4px solid var(--primary); background: rgba(65, 105, 225, 0.1); }
        .glass-player { background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); }
        .progress-bar { appearance: none; height: 4px; background: #30363d; border-radius: 2px; width: 100%; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; }
    </style>
</head>
<body class="flex flex-col">

    <header class="p-4 border-b border-slate-800 bg-[#0d1117] z-50">
        <div class="max-w-6xl mx-auto flex flex-col gap-3">
            <h1 class="text-xl font-black tracking-tighter">Indie<span class="text-[#4169e1]">Player</span></h1>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="Search for songs or artists..." class="flex-grow bg-[#161b22] border border-slate-700 rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="triggerSearch()" class="bg-[#4169e1] hover:bg-blue-600 px-6 py-2 rounded-full text-xs font-bold transition">Search</button>
            </div>
        </div>
    </header>

    <main class="flex-grow overflow-y-auto p-4 pb-48">
        <div id="statusMessage" class="text-center text-slate-500 text-sm my-4">Loading trending music...</div>
        <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 glass-player z-50">
        <div class="px-2"><input type="range" id="progressBar" value="0" class="progress-bar" oninput="isSeeking=true" onchange="seekAudio()"></div>
        <div class="flex items-center justify-between p-4 max-w-6xl mx-auto">
            <div class="flex items-center gap-3 w-1/3 overflow-hidden">
                <img id="playerCover" src="https://via.placeholder.com/150" class="w-12 h-12 rounded shadow-lg object-cover bg-slate-800">
                <div class="truncate">
                    <p id="playerTitle" class="text-xs font-bold truncate">No Track Selected</p>
                    <p id="playerArtist" class="text-[10px] text-slate-500 truncate">Tap a song to play</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="changeTrack(-1)" class="text-slate-400 hover:text-white"><i class="fas fa-step-backward text-lg"></i></button>
                <button id="masterPlayBtn" onclick="togglePlay()" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition active:scale-95"><i class="fas fa-play ml-1"></i></button>
                <button onclick="changeTrack(1)" class="text-slate-400 hover:text-white"><i class="fas fa-step-forward text-lg"></i></button>
            </div>
            <div class="w-1/3 text-right">
                <button id="favBtn" class="text-slate-500 hover:text-red-500"><i class="far fa-heart text-lg"></i></button>
            </div>
        </div>
        <div class="flex justify-center bg-black/40 py-1">
            <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-4159833368007973" data-ad-slot="8734484373"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </footer>

    <audio id="mainAudio" crossorigin="anonymous" playsinline></audio>

    <script>
        const audio = document.getElementById('mainAudio');
        let playlist = [], currentIndex = -1, isSeeking = false;
        const API_BASE = "https://saavn.dev/api"; // Primary API
        const API_FALLBACK = "https://jiosaavn-api-beta.vercel.app/api"; // Backup API

        window.onload = () => {
            fetchSongs('search/songs?query=Trending&limit=15');
            setupMediaSession();
        };

        async function fetchSongs(endpoint) {
            const status = document.getElementById('statusMessage');
            status.textContent = "Fetching music...";
            
            try {
                let response = await fetch(`${API_BASE}/${endpoint}`);
                if (!response.ok) throw new Error("Primary API failed");
                let result = await response.json();
                processResults(result);
            } catch (err) {
                console.warn("Switching to Fallback API...");
                try {
                    let response = await fetch(`${API_FALLBACK}/${endpoint}`);
                    let result = await response.json();
                    processResults(result);
                } catch (fallbackErr) {
                    status.textContent = "Connection error. Please check your internet.";
                }
            }
        }

        function processResults(result) {
            // Support different API response formats
            playlist = result.data?.results || result.data || [];
            document.getElementById('statusMessage').textContent = playlist.length ? "" : "No songs found.";
            renderView();
        }

        function renderView() {
            document.getElementById('resultsGrid').innerHTML = playlist.map((s, i) => `
                <div onclick="playSong(${i})" class="p-3 rounded-xl bg-slate-800/40 hover:bg-slate-800 transition cursor-pointer ${currentIndex === i ? 'active-track' : ''}">
                    <img src="${s.image[s.image.length-1].url}" class="w-full aspect-square object-cover rounded-lg mb-2 shadow-md">
                    <p class="text-[11px] font-bold truncate">${s.name}</p>
                    <p class="text-[10px] text-slate-500 truncate">${s.artists?.primary?.[0]?.name || 'Artist'}</p>
                </div>
            `).join('');
        }

        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const song = playlist[index];
            
            // Get best quality URL
            const streamUrl = song.downloadUrl[song.downloadUrl.length - 1].url;
            audio.src = streamUrl;
            
            document.getElementById('playerTitle').textContent = song.name;
            document.getElementById('playerArtist').textContent = song.artists?.primary?.[0]?.name || 'Artist';
            document.getElementById('playerCover').src = song.image[song.image.length-1].url;
            
            audio.play().catch(e => console.error("Playback failed", e));
            updateMediaMetadata(song);
            renderView();
        }

        function togglePlay() {
            if (audio.src) audio.paused ? audio.play() : audio.pause();
        }

        function changeTrack(dir) {
            let next = currentIndex + dir;
            if (next >= 0 && next < playlist.length) playSong(next);
        }

        function seekAudio() {
            isSeeking = false;
            audio.currentTime = (document.getElementById('progressBar').value / 100) * audio.duration;
        }

        audio.ontimeupdate = () => {
            if (!isSeeking && audio.duration) {
                document.getElementById('progressBar').value = (audio.currentTime / audio.duration) * 100;
            }
        };

        audio.onended = () => changeTrack(1);
        
        audio.onplay = () => { document.getElementById('masterPlayBtn').innerHTML = '<i class="fas fa-pause"></i>'; };
        audio.onpause = () => { document.getElementById('masterPlayBtn').innerHTML = '<i class="fas fa-play ml-1"></i>'; };

        function triggerSearch() {
            const query = document.getElementById('searchInput').value;
            if (query.trim()) fetchSongs(`search/songs?query=${encodeURIComponent(query)}&limit=25`);
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => audio.play());
                navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => changeTrack(-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => changeTrack(1));
            }
        }

        function updateMediaMetadata(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.name,
                    artist: song.artists?.primary?.[0]?.name || 'Unknown',
                    artwork: [{ src: song.image[song.image.length-1].url, sizes: '512x512', type: 'image/jpeg' }]
                });
            }
        }
    </script>
</body>
</html>
